<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<style>
  :root { --navy:#0b3a63; --navy2:#082c4b; --sky:#d4e4f3; --green:#1a891c; --red:#c62828; --ink:#1B2733; --muted:#55636F; --line:#D7DCE1; --bg:#f3f5f7; --stripe:#f7f9fb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Arial, Helvetica, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  .top { background:#fff; border-bottom:1px solid var(--line); }
  .top .wrap { position:relative; display:flex; align-items:center; justify-content:center; min-height:96px; }
  .top img.logo { height:76px; width:auto; display:block; }
  .top .shop { position:absolute; right:16px; top:50%; transform:translateY(-50%); text-align:right; font-size:12px; color:var(--muted); }
  .top .shop b { color:var(--navy); font-size:14px; }
  .cust { background:var(--navy); color:#fff; border-top:4px solid #990099; }
  .cust .wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:58px; }
  .cust h1 { margin:0; font-size:26px; font-weight:bold; letter-spacing:-.2px; }
  .tag { background:#3d7cc0; color:#fff; font-weight:bold; font-size:12px; padding:3px 8px; border-radius:3px; }
  .cust .label { margin-left:auto; font-size:12px; font-weight:bold; letter-spacing:1.5px; color:#9fc4e8; }
  .contact { background:var(--sky); border-bottom:1px solid #b9cfe4; }
  .contact .wrap { display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-height:44px; padding-top:6px; padding-bottom:6px; }
  .contact select { font:14px Arial, sans-serif; padding:5px 8px; border:1px solid #9db5cc; border-radius:4px; background:#fff; color:var(--ink); max-width:100%; }
  .contact .info { display:flex; gap:14px; flex-wrap:wrap; color:#24384c; font-size:13px; }
  .contact .info span { white-space:nowrap; }
  main { padding:16px 0 110px; }
  .intro { margin:0 0 14px; color:var(--muted); }
  .job { background:#fff; border:1px solid var(--line); margin:0 0 18px; }
  .jobbar { background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px; padding:9px 14px; flex-wrap:wrap; }
  .jobbar small { color:#9fc4e8; font-size:12px; }
  .jobbar b { font-size:16px; }
  .jobbar .from { margin-left:auto; color:#c9dbec; font-size:12px; }
  .art { display:flex; gap:16px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--line); background:#fff; }
  .design { display:flex; flex-direction:column; gap:6px; }
  .design .imgs { display:flex; gap:8px; }
  .design .imgs img, .design .imgs .noimg { width:130px; height:110px; object-fit:contain; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:zoom-in; }
  .design .imgs .noimg { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; cursor:default; }
  .design .cap { font-size:12px; color:var(--muted); }
  .design .cap b { color:var(--ink); }
  .garment { display:grid; grid-template-columns:84px minmax(0,1fr); gap:14px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .garment:nth-of-type(even) { background:var(--stripe); }
  .garment:last-child { border-bottom:0; }
  .gimg { width:84px; height:84px; object-fit:contain; background:#fff; border:1px solid var(--line); border-radius:4px; cursor:zoom-in; }
  .gimg.none { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; cursor:default; }
  .gname { font-weight:bold; font-size:15px; }
  .gname .vtag { background:var(--navy); color:#fff; font-size:11px; padding:1px 6px; border-radius:3px; margin-left:6px; vertical-align:middle; }
  .gdesc { color:var(--muted); font-size:13px; }
  .gcolor { font-size:13px; margin:2px 0 8px; }
  .sizes { display:flex; flex-wrap:wrap; gap:8px; }
  .size { width:60px; text-align:center; }
  .size label { display:block; background:var(--navy); color:#fff; font-size:11px; font-weight:bold; border-radius:3px 3px 0 0; padding:2px 0; }
  .size input { width:60px; padding:7px 4px; border:1px solid #b9c2cb; border-top:0; border-radius:0 0 4px 4px; text-align:center; font-size:15px; }
  .size input:focus { outline:2px solid #9fc4e8; }
  .size input.on { background:#e8f5e9; border-color:var(--green); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--navy); color:#fff; padding:10px 0; box-shadow:0 -2px 10px rgba(0,0,0,.15); }
  .bar .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .count b { font-size:20px; }
  button.primary { background:var(--green); color:#fff; border:0; border-radius:4px; padding:11px 20px; font-size:15px; font-weight:bold; cursor:pointer; }
  button.primary:disabled { opacity:.45; cursor:default; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); border-radius:4px; padding:10px 16px; font-size:14px; cursor:pointer; }
  .panel { background:#fff; border:1px solid var(--line); padding:18px; }
  .panel h2 { margin:0 0 12px; color:var(--navy); font-size:20px; }
  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .field label { display:block; font-size:13px; font-weight:bold; margin-bottom:4px; }
  .field input, .field textarea { width:100%; padding:9px 10px; border:1px solid #b9c2cb; border-radius:4px; font:14px Arial, sans-serif; }
  .field textarea { min-height:80px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .rushnote { display:none; margin-top:6px; background:#fdecea; color:var(--red); border:1px solid #f5c6c2; border-radius:4px; padding:6px 8px; font-size:12px; font-weight:bold; }
  .summary { margin:0 0 14px; border:1px solid var(--line); }
  .summary div { padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px; }
  .summary div:nth-child(even) { background:var(--stripe); }
  .summary div:last-child { border-bottom:0; }
  .err { color:var(--red); margin:10px 0 0; }
  .note { color:var(--muted); font-size:13px; }
  .center { text-align:center; padding:50px 16px; }
  .done h2 { color:var(--green); }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:50; padding:20px 70px; }
  #zoom img { max-width:100%; max-height:100%; background:#fff; border-radius:4px; }
  #zoom .zb { position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border:0; border-radius:50%; background:rgba(255,255,255,.9); color:var(--navy); font-size:28px; line-height:48px; cursor:pointer; }
  #zoom .zb:hover { background:#fff; }
  #zprev { left:12px; } #znext { right:12px; }
  #zclose { position:absolute; top:12px; right:14px; border:0; background:none; color:#fff; font-size:34px; cursor:pointer; line-height:1; }
  #zcount { position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  @media (max-width:640px) { #zoom { padding:20px 12px; } #zoom .zb { width:40px; height:40px; line-height:40px; font-size:24px; } }
  @media (max-width:640px) {
    .top img.logo { height:56px; }
    .top .wrap { min-height:76px; }
    .top .shop { display:none; }
    .cust h1 { font-size:21px; }
    .cust .label { display:none; }
    .grid2 { grid-template-columns:minmax(0,1fr); }
    .garment { grid-template-columns:60px minmax(0,1fr); gap:10px; }
    .gimg { width:60px; height:60px; }
    .design .imgs img, .design .imgs .noimg { width:calc(50vw - 30px); max-width:130px; height:96px; }
    .size, .size input { width:54px; }
  }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <img class="logo" id="logo" alt="G&amp;G Silkscreen + Embroidery" referrerpolicy="no-referrer">
  <div class="shop"><b>(508) 830-1075</b><br>sales@ggsilkscreen.com</div>
</div></div>
<div class="cust"><div class="wrap"><h1 id="cname">&nbsp;</h1><span class="tag" id="ccode" style="display:none"></span><span class="label">REORDER</span></div></div>
<div class="contact"><div class="wrap" id="contactbar" style="visibility:hidden">
  <select id="who" aria-label="Contact"></select>
  <div class="info"><span id="cphone"></span><span id="cemail"></span></div>
</div></div>
<main><div class="wrap" id="app"><div class="center">Loading your items...</div></div></main>
<div class="bar" id="bar" style="display:none"><div class="wrap">
  <div class="count"><b id="pcs">0</b> pieces selected</div>
  <button class="primary" id="next" disabled>Review &amp; send</button>
</div></div>
<div id="zoom"><img alt="" referrerpolicy="no-referrer"><button class="zb" id="zprev" aria-label="Previous image">&#8249;</button><button class="zb" id="znext" aria-label="Next image">&#8250;</button><button id="zclose" aria-label="Close">&times;</button><div id="zcount"></div></div>

<script>
var TOKEN = '';
var DATA = null, SAVED = null, ME = { name: '', email: '', phone: '' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
var app = $('app');

// Image viewer: click any picture, then use the arrows (or arrow keys / swipe) to go through every picture on the page.
var ZLIST = [], ZI = 0;
function zshow() { var z = $('zoom'); z.querySelector('img').src = ZLIST[ZI]; $('zcount').textContent = ZLIST.length > 1 ? (ZI + 1) + ' of ' + ZLIST.length : ''; $('zprev').style.display = $('znext').style.display = ZLIST.length > 1 ? '' : 'none'; }
function zoom(src) {
  if (!src) return;
  ZLIST = []; document.querySelectorAll('#app [data-z]').forEach(function (e) { var u = e.getAttribute('data-z'); if (u && ZLIST.indexOf(u) < 0) ZLIST.push(u); });
  ZI = Math.max(0, ZLIST.indexOf(src)); zshow(); $('zoom').style.display = 'flex';
}
function zstep(d) { if (ZLIST.length) { ZI = (ZI + d + ZLIST.length) % ZLIST.length; zshow(); } }
function zclose() { $('zoom').style.display = 'none'; }
$('zprev').onclick = function (e) { e.stopPropagation(); zstep(-1); };
$('znext').onclick = function (e) { e.stopPropagation(); zstep(1); };
$('zclose').onclick = function (e) { e.stopPropagation(); zclose(); };
$('zoom').onclick = function (e) { if (e.target === this) zclose(); };
document.addEventListener('keydown', function (e) { if ($('zoom').style.display !== 'flex') return; if (e.key === 'ArrowRight') zstep(1); else if (e.key === 'ArrowLeft') zstep(-1); else if (e.key === 'Escape') zclose(); });
(function () { var x0 = null; var z = $('zoom'); z.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true }); z.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) zstep(dx < 0 ? 1 : -1); x0 = null; }); })();

function niceDate(iso) {
  if (!iso) return '';
  var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function load() {
  google.script.run.withSuccessHandler(function (d) {
    if (!d.ok) { app.innerHTML = '<div class="center">' + esc(d.error) + '</div>'; return; }
    DATA = d; header(); render();
  }).withFailureHandler(function () { app.innerHTML = '<div class="center">Something went wrong loading this page. Please try again later.</div>'; }).getPortal(TOKEN);
}

function header() {
  if (DATA.logo) $('logo').src = DATA.logo;
  $('cname').textContent = DATA.customer;
  if (DATA.code) { $('ccode').textContent = DATA.code; $('ccode').style.display = ''; }
  var sel = $('who');
  sel.innerHTML = DATA.contacts.map(function (c, i) { return '<option value="' + i + '">' + esc(c.name) + '</option>'; }).join('') + '<option value="other">Someone else...</option>';
  var start = 0; DATA.contacts.forEach(function (c, i) { if (c.name === DATA.contact) start = i; });
  sel.value = DATA.contacts.length ? String(start) : 'other';
  sel.onchange = pickContact; pickContact();
  $('contactbar').style.visibility = 'visible';
}
function pickContact() {
  var v = $('who').value, c = v === 'other' ? { name: '', email: '', phone: '' } : DATA.contacts[+v];
  ME = { name: c.name || '', email: c.email || '', phone: c.phone || '' };
  $('cphone').textContent = ME.phone ? '☎ ' + ME.phone : '';
  $('cemail').textContent = ME.email ? '✉ ' + ME.email : '';
  if ($('f-name')) { $('f-name').value = ME.name; $('f-email').value = ME.email; $('f-phone').value = ME.phone; }
}

function render() {
  if (!DATA.jobs.length) { app.innerHTML = '<div class="center">There is nothing set up for reorder yet. Please contact GG Silkscreen at (508) 830-1075.</div>'; return; }
  var h = '<p class="intro">Enter the quantity you need under each size, then press <b>Review &amp; send</b>. We\'ll confirm pricing and the due date with you before anything is printed.</p>';
  DATA.jobs.forEach(function (j, ji) {
    h += '<section class="job"><div class="jobbar"><b>' + esc(j.name) + '</b></div>';
    if (j.designs.length) {
      h += '<div class="art">' + j.designs.map(function (d) {
        var imgs = (d.imgs && d.imgs.length ? d.imgs : (d.img ? [d.img] : []));
        var pics = imgs.length ? imgs.map(function (u) { return '<img src="' + esc(u) + '" data-z="' + esc(u) + '" alt="' + esc(d.location || d.name || 'Artwork') + '" referrerpolicy="no-referrer" loading="lazy">'; }).join('') : '<div class="noimg">No image</div>';
        return '<div class="design"><div class="imgs">' + pics + '</div><div class="cap"><b>' + esc(d.location || d.name || 'Artwork') + '</b> &middot; ' + esc(d.number) + '</div></div>';
      }).join('') + '</div>';
    }
    j.garments.forEach(function (g, gi) {
      h += '<div class="garment">' + (g.img ? '<img class="gimg" src="' + esc(g.img) + '" data-z="' + esc(g.img) + '" alt="" referrerpolicy="no-referrer" loading="lazy">' : '<div class="gimg none">No photo</div>') + '<div>' +
        '<div class="gname">' + esc(g.style) + (g.catalog ? '<span class="vtag">' + esc(g.catalog) + '</span>' : '') + '</div>' +
        '<div class="gdesc">' + esc(g.name || '') + '</div><div class="gcolor">Color: <b>' + esc(g.color) + '</b></div><div class="sizes">' +
        g.sizes.map(function (s, si) {
          var id = 'q' + ji + '_' + gi + '_' + si;
          return '<div class="size"><label for="' + id + '">' + esc(s.size) + '</label><input id="' + id + '" type="number" inputmode="numeric" min="0" step="1" data-j="' + ji + '" data-g="' + gi + '" data-s="' + si + '"></div>';
        }).join('') + '</div></div></div>';
    });
    h += '</section>';
  });
  app.innerHTML = h;
  $('bar').style.display = 'block';
  app.querySelectorAll('[data-z]').forEach(function (e) { e.onclick = function () { zoom(e.getAttribute('data-z')); }; });
  app.querySelectorAll('img').forEach(function (im) { im.onerror = function () { var n = document.createElement('div'); n.className = im.className === 'gimg' ? 'gimg none' : 'noimg'; n.textContent = 'No image'; im.replaceWith(n); }; });
  app.querySelectorAll('input[type=number]').forEach(function (i) { i.oninput = count; });
  count();
}

function lines() {
  var map = {};
  document.querySelectorAll('input[data-j]').forEach(function (i) {
    var q = Math.floor(Number(i.value) || 0); if (q <= 0) return;
    var j = DATA.jobs[+i.dataset.j], g = j.garments[+i.dataset.g], s = g.sizes[+i.dataset.s];
    var k = i.dataset.j + '_' + i.dataset.g;
    (map[k] = map[k] || { jobId: j.id, jobName: j.name, style: g.style, color: g.color, sizes: [] }).sizes.push([s.size, q]);
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}

function count() {
  var n = 0;
  document.querySelectorAll('input[data-j]').forEach(function (i) { var q = Math.floor(Number(i.value) || 0); i.classList.toggle('on', q > 0); if (q > 0) n += q; });
  $('pcs').textContent = n; $('next').disabled = !n;
}

$('next').onclick = function () {
  SAVED = Array.prototype.map.call(document.querySelectorAll('input[data-j]'), function (i) { return i.value; });
  var L = lines(), total = 0;
  L.forEach(function (l) { l.sizes.forEach(function (s) { total += s[1]; }); });
  $('bar').style.display = 'none';
  var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  var minD = tomorrow.getFullYear() + '-' + ('0' + (tomorrow.getMonth() + 1)).slice(-2) + '-' + ('0' + tomorrow.getDate()).slice(-2);
  app.innerHTML = '<div class="panel"><h2>Review your reorder</h2><div class="summary">' +
    L.map(function (l) { return '<div><b>' + esc(l.style) + '</b> ' + esc(l.color) + ' <span class="note">(' + esc(l.jobName) + ')</span><br>' + l.sizes.map(function (s) { return esc(s[0]) + ' x ' + s[1]; }).join(', ') + '</div>'; }).join('') +
    '<div><b>' + total + ' pieces total</b></div></div>' +
    '<div class="grid2"><div class="field"><label for="f-name">Your name *</label><input id="f-name" autocomplete="name"></div>' +
    '<div class="field"><label for="f-email">Email *</label><input id="f-email" type="email" autocomplete="email"></div>' +
    '<div class="field"><label for="f-phone">Phone</label><input id="f-phone" type="tel" autocomplete="tel"></div>' +
    '<div class="field"><label for="f-date">Needed by</label><input id="f-date" type="date" min="' + minD + '" value="' + esc(DATA.standardDate) + '">' +
    '<div class="hint">Standard turnaround is 2 weeks after approval: about <b>' + esc(niceDate(DATA.standardDate)) + '</b> if approved today.</div>' +
    '<div class="rushnote" id="rush">That\'s sooner than our standard turnaround, so we\'ll treat it as a rush and confirm we can make it.</div></div></div>' +
    '<div class="field" style="margin-top:12px"><label for="f-notes">Notes (changes, names, shipping...)</label><textarea id="f-notes"></textarea></div>' +
    '<p class="note">This is a request, not a payment. We\'ll email you pricing and a due date to confirm.</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="back">Back</button><button class="primary" id="send">Send reorder request</button></div><div class="err" id="err"></div></div>';
  $('f-name').value = ME.name; $('f-email').value = ME.email; $('f-phone').value = ME.phone;
  var rushCheck = function () { var v = $('f-date').value; $('rush').style.display = v && v < DATA.standardDate ? 'block' : 'none'; };
  $('f-date').oninput = rushCheck; $('f-date').onchange = rushCheck; rushCheck();
  $('back').onclick = function () { render(); document.querySelectorAll('input[data-j]').forEach(function (i, n) { i.value = SAVED[n]; }); count(); };
  $('send').onclick = function () {
    var btn = this, err = $('err'); err.textContent = '';
    var form = { name: $('f-name').value, email: $('f-email').value, phone: $('f-phone').value, neededBy: $('f-date').value, notes: $('f-notes').value, lines: L };
    if (!form.name.trim()) { err.textContent = 'Please enter your name.'; return; }
    if (!/^\S+@\S+\.\S+$/.test(form.email.trim())) { err.textContent = 'Please enter a valid email address.'; return; }
    btn.disabled = true; btn.textContent = 'Sending...';
    google.script.run.withSuccessHandler(function (r) {
      app.innerHTML = '<div class="panel center done"><h2>Thank you, your reorder was sent.</h2><p>' + r.pieces + ' pieces &middot; reference ' + esc(r.id) + '</p><p class="note">We\'ll be in touch with pricing and a due date' + (r.rush ? ', and we\'ll confirm whether we can make your rush date' : '') + '. Questions? Call (508) 830-1075.</p></div>';
      window.scrollTo(0, 0);
    }).withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Send reorder request'; err.textContent = (e && e.message) || 'Could not send. Please try again.'; }).submitReorder(TOKEN, form);
  };
  window.scrollTo(0, 0);
};

google.script.url.getLocation(function (loc) { TOKEN = (loc.parameter && loc.parameter.k) || ''; load(); });
</script>
</body>
</html>
